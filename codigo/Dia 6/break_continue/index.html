<!DOCTYPE html>
    <head>
        <title>Break_ Continue </title>
        
    </head>
    <body>

        <script>
            let miarray = [1, 5, 24, 95, 11, 10, 62, 15, 9];
            for (let numero of miarray){
                if (numero < 50) {
                    document.write ( numero+ "<br>");
                } else {
                    continue;
                    document.write ( numero+ "<br>");
                }

            }
            document.write("Esto es todo");          
        </script>
        
    </body>
</html>
